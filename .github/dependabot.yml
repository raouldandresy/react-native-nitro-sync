version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # react-native-nitro-modules, nitrogen e react-native-builder-bob sono
      # ancora in versione 0.x: per semver un bump "minor" (0.25 -> 0.37) NON
      # viene classificato come "semver-major" (il major resta 0), quindi va
      # ignorato esplicitamente anche il minor per ottenere lo stesso effetto
      # di protezione da breaking change che si avrebbe su un pacchetto >=1.0.
      # nitrogen (codegen) e react-native-nitro-modules (runtime) sono inoltre
      # pinnati sulla stessa 0.36.x: devono restare allineati, altrimenti i
      # binding generati rischiano di non corrispondere al runtime installato.
      - dependency-name: "react-native-nitro-modules"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "nitrogen"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-builder-bob"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @babel/core 8.x è un major appena rilasciato con breaking change noti
      # (formato di configurazione, requisiti Node più recenti) che possono
      # rompere la toolchain di build (react-native-builder-bob/Jest).
      - dependency-name: "@babel/core"
        update-types: ["version-update:semver-major"]
      # react e @types/react seguono il peerDependency range dichiarato dalla
      # versione di react-native in uso (attualmente react-native@0.86.x
      # richiede react/@types/react ^19.x): un major bump indipendente rompe
      # `npm ci` (ERESOLVE) finché react-native non aggiorna a sua volta il
      # proprio peer range.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/example"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Mantiene l'app di esempio stabile senza rompere il framework Expo/RN
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      # react-native-mmkv e react-native-nitro-modules sono dipendenze
      # native strettamente accoppiate alla versione usata nella libreria
      # principale: un major bump può introdurre API incompatibili con il
      # codice demo (vedi example/app/_layout.tsx) senza che la CI se ne
      # accorga (l'esempio non è coperto dal workflow CI).
      - dependency-name: "react-native-mmkv"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-nitro-modules"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
