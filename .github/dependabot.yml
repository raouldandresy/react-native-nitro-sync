version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Previene major breaking updates su Nitro Modules e tooling di build
      - dependency-name: "react-native-nitro-modules"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native-builder-bob"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/example"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Mantiene l'app di esempio stabile senza rompere il framework Expo/RN
      - dependency-name: "expo*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
